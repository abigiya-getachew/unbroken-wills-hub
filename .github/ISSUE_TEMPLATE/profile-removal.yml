name: Profile Removal or Edit Request
description: Request an edit to or removal of your published profile
title: "[Profile Request]: "
labels: ["profile", "community"]
assignees: abigiya-getachew
body:
  - type: markdown
    attributes:
      value: |
        Use this form to edit or remove your published directory profile. Do not include private or sensitive information.

  - type: input
    id: display-name
    attributes:
      label: Name as listed
      description: The name shown in your published profile.
      placeholder: e.g. Selam Tesfaye
    validations:
      required: true

  - type: input
    id: original-issue
    attributes:
      label: Original Profile Issue Number
      description: "If known, add the issue number used for the original profile submission. Example: 12"
      placeholder: e.g. 12
    validations:
      required: false

  - type: dropdown
    id: request-type
    attributes:
      label: What do you need?
      options:
        - Edit my profile
        - Remove my profile
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Requested changes
      description: For removal, you can write "Please remove my profile."
      placeholder: e.g. Please update my role and remove my old link.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Verification
      options:
        - label: This is my profile, or I am authorized to request this change.
          required: true