name: Profile Submission
description: Submit your real profile to the Unbroken Wills directory
title: "[Profile]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a profile to the Unbroken Wills directory.

        Please only submit your own profile or a profile you have clear permission to share.

        Do not include private information such as phone numbers, home addresses, ID numbers, passwords, or personal email addresses.

        Use a general location only, such as "Addis Ababa, Ethiopia".

  - type: input
    id: display-name
    attributes:
      label: Display Name
      description: The name you want shown publicly in the directory.
      placeholder: e.g. Selam Tesfaye
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role
      description: Your current role, title, or what you are studying.
      placeholder: e.g. Software Engineering Student
    validations:
      required: true

  - type: dropdown
    id: field
    attributes:
      label: Field
      description: Choose the closest category.
      options:
        - Technology
        - Tools
        - Community
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: City and country only. Do not provide a home address.
      placeholder: e.g. Addis Ababa, Ethiopia
    validations:
      required: true

  - type: textarea
    id: bio
    attributes:
      label: Short Bio
      description: One or two sentences about you, what you are learning, and how you want to contribute.
      placeholder: e.g. I am interested in open-source web development and building practical digital tools for community use.
    validations:
      required: true

  - type: input
    id: skills
    attributes:
      label: Skills
      description: Separate skills with commas.
      placeholder: e.g. Next.js, TypeScript, Tailwind CSS, Git
    validations:
      required: true

  - type: input
    id: offers
    attributes:
      label: What can you offer?
      description: Separate items with commas. This helps others know how you can contribute.
      placeholder: e.g. code review, beginner mentoring, spreadsheet help, event planning
    validations:
      required: false

  - type: input
    id: needs
    attributes:
      label: What are you looking for?
      description: Separate items with commas. This helps the community support you.
      placeholder: e.g. project collaboration, feedback, learning resources, internship advice
    validations:
      required: false

  - type: input
    id: public-link
    attributes:
      label: Optional Public Link
      description: Add a GitHub, LinkedIn, portfolio, or website link. Do not add private links.
      placeholder: e.g. https://github.com/username
    validations:
      required: false

  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      description: Please confirm the following before submitting.
      options:
        - label: I confirm this is my profile or I have clear permission to share it.
          required: true
        - label: I understand this profile may be published in the open-source directory.
          required: true
        - label: I understand I can request removal or edits later by opening a removal issue.
          required: true