name: Profile Submission
description: Submit your profile to the Unbroken Wills directory
title: "[Profile]: "
labels: ["profile", "community", "new-entry"]
assignees: abigiya-getachew
body:
  - type: markdown
    attributes:
      value: |
        Share only information you are comfortable making public. Use a city and country, not a street address. Do not include phone numbers, private email addresses, ID numbers, passwords, or personal documents.

  - type: input
    id: display-name
    attributes:
      label: Name to display
      description: The name you want shown publicly.
      placeholder: e.g. Selam Tesfaye
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role or field of study
      description: Your role, title, or what you are studying.
      placeholder: e.g. Software Engineering Student
    validations:
      required: true

  - type: dropdown
    id: field
    attributes:
      label: Field
      description: Choose the closest category for your profile.
      options:
        - Technology
        - Tools
        - Community
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: City and country only. Do not provide a home address.
      placeholder: e.g. Addis Ababa, Ethiopia
    validations:
      required: true

  - type: textarea
    id: bio
    attributes:
      label: Short bio
      description: One or two sentences about you and how you want to contribute.
      placeholder: e.g. I am interested in open-source web development and building practical digital tools for community use.
    validations:
      required: true

  - type: input
    id: skills
    attributes:
      label: Skills
      description: Separate skills with commas.
      placeholder: e.g. Next.js, TypeScript, Tailwind CSS, Git
    validations:
      required: true

  - type: input
    id: offers
    attributes:
      label: What can you offer? (optional)
      description: Separate items with commas.
      placeholder: e.g. code review, beginner mentoring, spreadsheet help, event planning
    validations:
      required: false

  - type: input
    id: needs
    attributes:
      label: What are you looking for? (optional)
      description: Separate items with commas.
      placeholder: e.g. project collaboration, feedback, learning resources, internship advice
    validations:
      required: false

  - type: input
    id: public-link
    attributes:
      label: Public link (optional)
      description: GitHub, LinkedIn, portfolio, or website. Do not share private links.
      placeholder: e.g. https://github.com/username
    validations:
      required: false

  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      description: All confirmations are required before submitting.
      options:
        - label: This is my profile, and I consent to sharing these details publicly.
          required: true
        - label: I understand my profile may be published in the public directory.
          required: true
        - label: I can request edits or removal at any time using the Profile Removal or Edit Request form.
          required: true