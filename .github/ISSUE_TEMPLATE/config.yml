blank_issues_enabled: false
contact_links:
  - name: 💬 Discussions / Community Chat
    url: https://github.com/abigiya-getachew/unbroken-wills-hub/discussions
    about: General questions, ideas, and community conversations

issue_templates:
  - name: 👤 Profile Submission
    description: Add yourself to the community directory
    file: ./profile-submission.yml
