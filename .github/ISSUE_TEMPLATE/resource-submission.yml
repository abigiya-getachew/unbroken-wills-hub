name: Resource Submission
description: Share a learning resource, guide, template, or tool
title: "[Resource]: "
labels: ["resource", "community"]
assignees: abigiya-getachew
body:
  - type: markdown
    attributes:
      value: |
        Submit resources you created or have permission to share. Do not include private or sensitive material, executables, or archives. For files, add a public link or attach the file in a comment after submitting.

  - type: input
    id: resource-title
    attributes:
      label: Title
      description: Give the resource a clear name.
      placeholder: e.g. Beginner Git and GitHub Guide
    validations:
      required: true

  - type: dropdown
    id: resource-category
    attributes:
      label: Category
      description: Choose the closest category.
      options:
        - Learning
        - Guides
        - Tools
        - Templates
        - Code Snippets
        - Checklists
        - Community
        - Other
    validations:
      required: true

  - type: dropdown
    id: resource-type
    attributes:
      label: Resource Type
      description: Choose the closest match.
      options:
        - link
        - file
        - note
    validations:
      required: true

  - type: textarea
    id: resource-description
    attributes:
      label: Short description
      description: What does this help with, and who is it for?
      placeholder: e.g. This guide helps beginners understand Git commands and GitHub pull requests.
    validations:
      required: true

  - type: input
    id: resource-url
    attributes:
      label: Link (optional)
      description: Add a public link if applicable.
      placeholder: e.g. https://example.com/guide
    validations:
      required: false

  - type: textarea
    id: resource-content
    attributes:
      label: Content or file details (optional)
      description: For a note, include its content. For a file, describe it here and attach it in a comment.
      placeholder: e.g. This is a CSV budget template with columns for income, expense, category, and date.
    validations:
      required: false

  - type: input
    id: resource-tags
    attributes:
      label: Tags
      description: Separate tags with commas.
      placeholder: e.g. Git, GitHub, beginners, open source
    validations:
      required: false

  - type: input
    id: submitted-by
    attributes:
      label: Credit (optional)
      description: Name or GitHub username; leave blank to submit anonymously.
      placeholder: e.g. Selam Tesfaye
    validations:
      required: false

  - type: checkboxes
    id: permissions
    attributes:
      label: Confirmation
      description: All confirmations are required.
      options:
        - label: I created this resource or have permission to share it.
          required: true
        - label: This resource is free to access or open source, and contains no private or sensitive information.
          required: true
        - label: I understand a maintainer will review it before publication.
          required: true